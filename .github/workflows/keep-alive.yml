name: Keep database alive

# The deployed Supabase project is on the free tier, which auto-pauses a
# database after ~7 days with no activity. A paused DB makes every
# DB-touching request 500 until someone manually resumes it from the
# Supabase dashboard — not something a portfolio visitor can do. This pings
# the live API often enough to stay under that threshold.
on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API (touches the DB, keeps Supabase awake)
        run: |
          curl -sS -X POST https://booking-api-neon.vercel.app/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"keepalive@example.com","password":"not-a-real-password"}' \
            -o /dev/null -w "Pinged API, got HTTP %{http_code}\n"
