services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_api
    ports:
      - "5432:5432"
    volumes:
      - booking_api_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/booking_api?schema=public
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      PORT: 3000
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # Baked into the JS bundle at build time (Vite env vars aren't
        # readable at container runtime). Must be the HOST-exposed API
        # port: the browser running the bundle is outside the Docker
        # network and can't resolve the `api` service's internal DNS name.
        VITE_API_URL: http://localhost:3000
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  booking_api_db_data:
